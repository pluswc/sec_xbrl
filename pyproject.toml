[project]
name = "sec-xbrl-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "arelle-release",
  "httpx",
  "openpyxl>=3.1",
  "polars",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_xbrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: explicit cached-fixture integration test; never requires network access",
]

[tool.ruff]
line-length = 100

[project]
name = "sec-xbrl-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "arelle-release",
  "httpx",
  "polars",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_xbrl"]

[tool.hatch.build.targets.wheel.force-include]
"src/sec_xbrl/display/hierarchy.html" = "sec_xbrl/display/hierarchy.html"
"src/sec_xbrl/display/hierarchy.css" = "sec_xbrl/display/hierarchy.css"
"src/sec_xbrl/display/hierarchy.js" = "sec_xbrl/display/hierarchy.js"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

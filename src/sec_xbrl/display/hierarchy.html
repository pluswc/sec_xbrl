<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>공시 구조 · SEC XBRL</title><link rel="stylesheet" href="hierarchy.css">
<body><header><div class="brand">SEC <strong>공시 구조</strong></div><span class="edition">H1 · U3-R · H2 / 준비된 데이터</span></header>
<main><section class="intro"><div><span class="eyebrow">AS-FILED FINANCIAL EXPLORER</span><h1>원문에서 합계까지.</h1><p>보고된 구조를 펼치고, 가감 관계와 중요 항목의 근거를 확인합니다.</p></div><div id="pub" class="pub"></div></section>
<section class="controls"><label>기업<select id="company"></select></label><label class="wide">공시 · 보고기간 / 제출일<select id="filing"></select></label><label class="wide">재무제표 · 원문 표<select id="statement"></select></label><label>표 보기<select id="mode"><option value="source">원문 순서 + 검토된 묶음</option><option value="pre">PRE 표시 계층</option><option value="analytical">기간 비교 · 기존 Analytical</option></select></label></section>
<div id="warnings" class="warnings" role="status"></div>
<section class="workspace"><div class="tablehead"><div><h2 id="title"></h2><div id="scope" class="muted"></div></div><div class="actions"><button id="collapse">묶음 접기</button><button id="restore">전체 복원</button><button id="blank-toggle">빈 레이아웃 행 표시</button><label>깊이 <select id="depth"><option value="all">전체</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label><span id="hidden-count"></span></div></div>
<div class="lenses"><label>탐색<select id="explore"><option value="statement">재무 항목</option><option value="member">세그먼트 → 공시 지표</option></select></label><label>독립 Axis<select id="axis"></select></label><label>Member<select id="member"></select></label><button id="all-concepts">전체 공시 지표</button><span id="lens-warning" class="muted"></span></div>
<div class="scroll"><table id="financial-table"><thead><tr><th>원문 항목 / 계층</th><th>공시 값 · Raw 원금액 <div id="period-header" class="period-header"></div></th><th>중요도 / 가감 검증 / 출처</th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="coverage" class="foot"></div></section>
<aside id="inspector" hidden><div class="inspecthead"><h2>근거 확인</h2><button id="close-inspector">닫기</button></div><div id="inspection"></div></aside>
<footer>공시 원문과 검토된 정책을 보존합니다. 화면의 펼치기·접기는 값이나 검증 결과를 바꾸지 않습니다.</footer></main>
<script>window.HIERARCHY_CATALOG=__CATALOG__;window.HIERARCHY_PUBLICATION=__PUBLICATION__;</script><script src="hierarchy.js"></script></body></html>
